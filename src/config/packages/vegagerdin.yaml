# Weather card for vegagerdin.is (2025-12-10)
# Author: Kristján Bjarni Guðmundsson
# https://github.com/kristjanbjarni/home-assistant-packages

input_text:
  vegagerdin_vedurstod:
    name: Vegagerðin - Veðurstöð
    icon: mdi:weather-cloudy

sensor vegagerdin source:
  platform: rest
  name: vegagerdin_source
  resource: http://gagnaveita.vegagerdin.is/api/vedur2014_1
  headers:
    Accept: application/xml
  json_attributes_path: "$.ArrayOfVedur"
  json_attributes:
    - Vedur
  value_template: "OK"
  scan_interval: 600

template:
  - sensor:
    - default_entity_id: sensor.vegagerdin_vedurstod
      name: "Veðurstöð"
      state: >
        {% set v = states('input_text.vegagerdin_vedurstod') %}
        {% if v!="unknown" %}
          {{ v }}
        {% else %} 
          Reykjavík
        {% endif %}
      icon: "mdi:weather-windy"
  
  - sensor:
    - default_entity_id: sensor.vegagerdin_current
      state: "{{ states('sensor.vegagerdin_vedurstod') }}"
      attributes:
        vedurstod: "{{ state_attr('sensor.vegagerdin_source','Vedur') | selectattr('Nafn','equalto',states('sensor.vegagerdin_vedurstod')) | first }}"

  - sensor:
    - default_entity_id: sensor.vegagerdin_temperature
      name: "Hitastig"
      state: "{{ state_attr('sensor.vegagerdin_current','vedurstod').Hiti | float(default=0) }}"
      device_class: temperature
      unit_of_measurement: "°C"
      
  - sensor:
    - default_entity_id: sensor.vegagerdin_wind_speed
      name: "Vindhraði"
      state: "{{ state_attr('sensor.vegagerdin_current','vedurstod').Vindhradi | float(default=0)  }}"
      unit_of_measurement: "m/s"
      icon: "mdi:weather-windy"
      
  - sensor:
    - default_entity_id: sensor.vegagerdin_wind_bearing
      name: "Vindátt"
      state: >
        {% set vedurstod = state_attr('sensor.vegagerdin_current','vedurstod') %}
        {% if vedurstod is not none %}
          {{ vedurstod.VindattAsc | default('') }}
        {% else %}
          None
        {% endif %}
      icon: "mdi:windsock"
      
  - sensor:
    - default_entity_id: sensor.vegagerdin_humidity
      name: "Rakastig"
      state: >
        {% set vedurstod = state_attr('sensor.vegagerdin_current','vedurstod') %}
        {% if vedurstod is not none %}
          {{ vedurstod.Raki | float(default=0) }}
        {% else %}
          None
        {% endif %}
      device_class: humidity
      unit_of_measurement: "%"
      
  - sensor:
    - default_entity_id: sensor.vegagerdin_pressure
      name: "Loftþrýstingur"
      state: "{{ state_attr('sensor.vegagerdin_current','vedurstod').Loftthrystingur | float(default=0)  }}"
      device_class: pressure
      unit_of_measurement: "hPa"

  - weather:
    - name: "Vegagerðin"
      unique_id: weather.vegagerdin
      default_entity_id: weather.vegagerdin    
      attribution_template: "Byggt á gögnum frá Vegagerðinni"
      condition_template: "{{ none }}"
      temperature_template: "{{ states('sensor.vegagerdin_temperature') | float(0) }}"
      humidity_template: "{{ states('sensor.vegagerdin_humidity') | float(0) }}"
      pressure_template: "{{ states('sensor.vegagerdin_pressure') | float(0) }}"
      wind_speed_template: "{{ states('sensor.vegagerdin_wind_speed') | float(0) }}"
      wind_bearing_template: "{{ states('sensor.vegagerdin_wind_bearing') }}"

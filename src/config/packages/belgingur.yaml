# Weather card for belgingur.is (2025-12-10)
# Author: Kristján Bjarni Guðmundsson
# https://github.com/kristjanbjarni/home-assistant-packages

sensor belgingur source:
  platform: rest    
  name: belgingur_source
  resource_template: >
                 {% set lat = state_attr('zone.home','latitude') %}
                 {% set lon = state_attr('zone.home','longitude') %}
                 https://wod-odinn.belgingur.is/api/v2/data/point/schedule/island-8-2/2/latlon/{{lat}},{{lon}}/meteogram.xml
  json_attributes_path: "$.weatherdata.forecast.tabular"
  json_attributes:
    - time
  value_template: "{{value_json.weatherdata.location.ref}}"
  scan_interval: 600

template:
- sensor:
    - default_entity_id: sensor.belgingur_condition_lookup
      state: "OK"
      attributes:
        condition: >
          {% set vedur_condition = {'Fair':'sunny',
                                'Clear sky':'sunny',
                                'Cloudy':'cloudy',
                                'Heavy rain showers':'pouring',
                                'Light rain':'rainy',
                                'Light rain showers':'rainy',
                                'Light sleet':'snowy-rainy',
                                'Light sleet showers':'snowy-rainy',
                                'Light snow':'snowy', 
                                'Light snow showers':'snowy',
                                'Partly cloudy':'partlycloudy',
                                'Rain':'rainy',
                                'Rain showers':'pouring',
                                'Sleet':'snowy-rainy',
                                'Sleet showers':'snowy-rainy',
                                'Snow':'snowy',
                                'Snow showers':'snowy'
                               } %}
          {{ vedur_condition }}

- sensor:
    - default_entity_id: sensor.belgingur_current
      state: "OK"
      attributes:
        time: >
          {% set n = now().timestamp() %}
          {% set current = namespace(time=none, break=false) %}
          {% set times = state_attr('sensor.belgingur_source','time') %}
          {% for t in times if not current.break %}
            {% set from = as_timestamp(strptime(t['@from'],'%Y-%m-%dT%H:%M:%S')) %}
            {% set to = as_timestamp(strptime(t['@to'],'%Y-%m-%dT%H:%M:%S')) %}
            {% if n>=from and n<to %}
              {% set current.time = t %}
              {% set current.break = true %}
            {% endif %}            
          {% endfor %}
          {% if current.time is none %}
            {% set current.time = times[0] %}
          {% endif %}
          {{ current.time }}

- sensor:
  - default_entity_id: sensor.belgingur_temperature
    name: "Hitastig"
    state: >
      {% set time = state_attr('sensor.belgingur_current','time') %}
      {% if time is not none %}
        {{ time.temperature['@value'] | float(default=0) }}
      {% else %}
        None
      {% endif %}
    device_class: temperature
    unit_of_measurement: "°C"
      
- sensor:
  - default_entity_id: sensor.belgingur_wind_speed
    name: "Vindhraði"
    state: >
      {% set time = state_attr('sensor.belgingur_current','time') %}
      {% if time is not none %}
        {{ time.windSpeed['@mps'] | float(default=0) }}
      {% else %}
        None
      {% endif %}      
    unit_of_measurement: "m/s"
    icon: "mdi:weather-windy"
    
- sensor:
  - default_entity_id: sensor.belgingur_wind_bearing
    name: "Vindátt"
    state: >
      {% set time = state_attr('sensor.belgingur_current','time') %}
      {% if time is not none %}
        {{ time.windDirection['@code'] | float(default=0) }}
      {% else %}
        None
      {% endif %} 
    icon: "mdi:windsock"
    
- sensor:
  - default_entity_id: sensor.belgingur_condition_org
    name: "Veðurlýsing (Original)"
    state: >
      {% set time = state_attr('sensor.belgingur_current','time') %}
      {% if time is not none %}
        {{ time.symbol['@name'] | float(default=0) }}
      {% else %}
        None
      {% endif %} 
    icon: "mdi:weather-cloudy"
    
- sensor:
  - default_entity_id: sensor.belgingur_condition
    name: "Veðurlýsing"
    state: >
      {% set cond = states('sensor.belgingur_condition_org') %}
      {{ state_attr('sensor.belgingur_condition_lookup','condition').get(cond) }}
    icon: "mdi:weather-cloudy"
    
- sensor:
  - default_entity_id: sensor.belgingur_humidity
    name: "Rakastig"
    state: >
      {% set time = state_attr('sensor.belgingur_current','time') %}
      {% if time is not none %}
        {{ time.humidity['@value'] | float(default=0) }}
      {% else %}
        None
      {% endif %}       
    device_class: humidity
    unit_of_measurement: "%"
    
- sensor:
  - default_entity_id: sensor.belgingur_pressure
    name: "Loftþrýstingur"
    state: >
      {% set time = state_attr('sensor.belgingur_current','time') %}
      {% if time is not none %}
        {{ time.pressure['@value'] | float(default=0) }}
      {% else %}
        None
      {% endif %} 
    device_class: pressure
    unit_of_measurement: "hPa"
    
- sensor:
  - default_entity_id: sensor.belgingur_forecast
    name: "Veðurspá"
    state: "OK"
    icon: "mdi:weather-cloudy"
    attributes:
      forecast_hourly: >
        {% set forecasts = namespace(items=[]) %}
        {% for f in state_attr('sensor.belgingur_source','time') %}
          {% set cur_date = f['@from'][0:10] %}
          {% set cur_time = f['@from'][11:13] %}
          {% set cur_temp = float(f.temperature['@value']) %}
          {% set cur_cond = f.symbol['@name'] %}
          {% set cur_wind = float(f.windSpeed['@mps']) %}
          {% set cond = none %}
          {% if state_attr('sensor.belgingur_condition_lookup','condition') %}
            {% set cond = state_attr('sensor.belgingur_condition_lookup','condition').get(cur_cond) %}
          {% endif %}
          {% set data = {'datetime': cur_date+'T'+cur_time+':00:00Z', 
                       'condition': cond,
                       'temperature': cur_temp,
                       'wind_speed': cur_wind } %}
          {% set forecasts.items = forecasts.items + [data] %}
        {% endfor %}
        {{ forecasts.items }}

- weather:
  - name: "Belgingur"
    unique_id: weather.belgingur
    default_entity_id: weather.belgingur
    attribution_template: "Gögn frá Belgingur.is"
    condition_template: "{{ states('sensor.belgingur_condition') }}"
    temperature_template: "{{ states('sensor.belgingur_temperature') | float(0) }}"
    humidity_template: "{{ states('sensor.belgingur_humidity') | float(0) }}"
    pressure_template: "{{ states('sensor.belgingur_pressure') | float(0) }}"
    wind_speed_template: "{{ states('sensor.belgingur_wind_speed') | float(0) }}"
    wind_bearing_template: "{{ states('sensor.belgingur_wind_bearing') }}"
    forecast_hourly_template: "{{ state_attr('sensor.belgingur_forecast','forecast_hourly') }}"
